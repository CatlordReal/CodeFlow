name: Verify Windows draft

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag to verify
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  installed-runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download draft installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          New-Item -ItemType Directory -Path output/download -Force | Out-Null
          gh release download $env:RELEASE_TAG --pattern "*-setup.exe" --dir output/download
          $installers = @(Get-ChildItem output/download -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)."
          }
      - name: Install draft into runner temp
        shell: pwsh
        run: |
          $installer = Get-ChildItem output/download -Filter "*-setup.exe" -File | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP "codeflow-smoke-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/NS", "/D=$installDirectory" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)."
          }
          $executables = @(Get-ChildItem $installDirectory -Recurse -Filter codeflow.exe -File)
          if ($executables.Count -ne 1) {
            throw "Expected one installed codeflow.exe, found $($executables.Count)."
          }
          "CODEFLOW_EXE=$($executables[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed Windows runtime
        shell: pwsh
        timeout-minutes: 2
        run: >-
          ./.github/scripts/windows-smoke.ps1
          -ExecutablePath "$env:CODEFLOW_EXE"
          -ScreenshotPath ./proof/windows-smoke.png
      - name: Upload installed runtime proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeflow-installed-windows-proof
          path: proof/
          if-no-files-found: warn
          retention-days: 14
