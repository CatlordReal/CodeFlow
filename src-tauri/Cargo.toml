[package]
name = "codeflow"
version = "0.3.1"
description = "Local C++ flowchart viewer"
authors = ["CatlordReal"]
edition = "2021"

[lib]
name = "codeflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream", "system-proxy"] }
tempfile = "3"
base64 = "0.22.1"
getrandom = "0.3.4"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-cpp = "0.23.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
