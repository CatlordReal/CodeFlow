[package]
name = "codeflow"
version = "0.1.0"
description = "Local C++ flowchart viewer"
authors = ["CatlordReal"]
edition = "2021"

[lib]
name = "codeflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-cpp = "0.23.4"
